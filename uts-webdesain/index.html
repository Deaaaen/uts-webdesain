<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - aespa</title>

    <!-- CSS Eksternal -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <!-- BAGIAN ILUSTRASI -->
        <section class="visual-section" aria-label="Branding illustration">

            <div class="brand-mark">
                <span class="brand-icon">a</span>
                <span>aespa</span>
            </div>

            <div class="artwork">
                <div class="circle circle-one"></div>
                <div class="circle circle-two"></div>
                <div class="square"></div>

                <div class="floating-card">
                    <span class="mini-dot"></span>
                    <span class="mini-dot"></span>
                    <span class="mini-dot"></span>
                </div>

                <div class="main-shape">
                    <div class="shape-line line-one"></div>
                    <div class="shape-line line-two"></div>
                    <div class="shape-line line-three"></div>
                </div>
            </div>

            <div class="visual-text">
                <p class="small-title">WELCOME BACK</p>
                <h2>Make your ideas<br>come to life.</h2>
                <p>
                    Masuk kembali dan lanjutkan perjalanan
                    kreatifmu bersama aespa.
                </p>
            </div>

            <div class="page-number">01 / 03</div>

        </section>


        <!-- BAGIAN FORM LOGIN -->
        <section class="form-section">

            <div class="form-wrapper">

                <div class="mobile-logo">
                    <span class="brand-icon">a</span>
                    <span>aespa</span>
                </div>

                <div class="form-heading">
                    <p class="welcome">WELCOME BACK</p>
                    <h1>Sign in</h1>
                    <p class="description">
                        Enter your details to access your account.
                    </p>
                </div>

                <form class="login-form">

                    <!-- Google Sign In -->
                    <button
                        type="button"
                        class="google-button"
                        aria-label="Sign in with Google">
                        <span class="google-icon">G</span>
                        <span>Sign in with Google</span>
                    </button>

                    <!-- Divider -->
                    <div class="divider">
                        <span></span>
                        <p>or</p>
                        <span></span>
                    </div>

                    <!-- Email -->
                    <div class="input-group">
                        <label for="email">Email or Username</label>
                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Enter your email or username"
                            autocomplete="username"
                            required>
                    </div>

                    <!-- Password -->
                    <div class="input-group">
                        <div class="password-label">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>
                    </div>

                    <!-- Remember Me -->
                    <div class="remember-row">
                        <label class="checkbox-container">
                            <input type="checkbox" id="remember" name="remember">
                            <span class="custom-checkbox"></span>
                            <span>Remember Me</span>
                        </label>
                    </div>

                    <!-- Sign In -->
                    <button
                        type="submit"
                        class="signin-button"
                        aria-label="Sign in to your account">
                        Sign In
                        <span class="arrow" aria-hidden="true">→</span>
                    </button>

                </form>

                <p class="signup-text">
                    Don't have an account?
                    <a href="#">Create an account</a>
                </p>

            </div>

        </section>

    </main>

</body>
</html>
